# Builds the Linux packages, the Windows program and the macOS app, and tests
# them on several Linux distributions, on Windows and on macOS.
#
# - On every push and pull request: build and test.
# - When a tag like v0.4.0 is pushed: also create a GitHub release with the
#   packages attached.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          rustup toolchain install stable --profile minimal
          # window system libraries bundled in the AppImage as a fallback
          sudo apt-get update
          sudo apt-get install -y libxkbcommon0 libxkbcommon-x11-0 libxcursor1 libxi6 libx11-xcb1 libxcb-xkb1 libxext6 libxrender1 libxfixes3
          python3 -m pip install --break-system-packages ziglang zstandard
          cargo install --locked cargo-zigbuild cargo-generate-rpm
          sudo curl -sSLo /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Run tests
        run: cargo test --release --locked

      - name: Build packages
        run: bash packaging/build-packages.sh

      - name: Check that the AppImage runs
        run: |
          ./dist/Spacemapper-*-x86_64.AppImage --appimage-extract-and-run --version
          # it has to keep its window open on a bare X server
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          set +e
          DISPLAY=:99 timeout 15 ./dist/Spacemapper-*-x86_64.AppImage --appimage-extract-and-run
          code=$?
          set -e
          if [ "$code" != 124 ]; then echo "The AppImage quit after starting (exit code $code)"; exit 1; fi

      - uses: actions/upload-artifact@v6
        with:
          name: packages
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update Rust
        run: rustup update stable --no-self-update

      - name: Run tests
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Check that it runs
        shell: bash
        run: ./target/release/spacemapper.exe --version

      - name: Collect
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist
          cp target/release/spacemapper.exe "dist/Spacemapper-$v-windows-x64.exe"

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update Rust
        run: rustup update stable --no-self-update

      - name: Run tests
        run: cargo test --release --locked

      - name: Build the app
        run: bash packaging/macos/build-app.sh

      - name: Check that it runs
        run: ./dist/Spacemapper.app/Contents/MacOS/spacemapper --version

      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: dist/*.zip

  test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: debian:13
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: ubuntu:22.04
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: fedora:latest
            install: dnf install -y ./dist/*.rpm
          - image: opensuse/tumbleweed
            install: zypper --non-interactive install --allow-unsigned-rpm ./dist/*.rpm
          - image: archlinux:latest
            install: pacman -Syu --noconfirm && pacman -U --noconfirm ./dist/*.pkg.tar.zst
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: packages
          path: dist
      - name: Install package
        run: ${{ matrix.install }}
      - name: Check that it runs
        run: |
          spacemapper --version
          test -f /usr/share/applications/spacemapper.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/spacemapper.png

  release:
    needs: [build, test, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: packages
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: macos
          path: dist
      - name: Checksums
        run: cd dist && rm -f SHA256SUMS && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
